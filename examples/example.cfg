# ld65 configuration for KERNAL example programs: a flat binary linked to run
# from work RAM at $010000, exactly the bytes the S-record converter wraps -
# no fill, no vectors, entry at the first byte.

MEMORY {
    MAIN: start = $010000, size = $008000, type = rw, file = %O;
}

SEGMENTS {
    CODE:   load = MAIN, type = rw;
    RODATA: load = MAIN, type = rw;
}
