# ld65 configuration for the HB816 KERNAL ROM.
#
# The output file is the 512 KiB image the HB816's system ROM socket holds. The
# decoder answers both ROM ranges by masking the CPU address with $7FFFF, so:
#
#   - image offsets $C000-$FFFF appear in bank 0 at $00C000-$00FFFF (the window
#     that holds the vectors and everything interrupt dispatch can reach), and
#   - the whole image repeats eight times through $C00000-$FFFFFF, so image
#     offset $10000 runs at CPU address $C10000.
#
# Memory areas are written to the file in declaration order, each padded to its
# full size, so the file offsets accumulate independently of the start addresses.
# The start addresses are the RUN addresses: bank-0 areas use their bank-0
# window addresses (offset and address coincide there), and the far area uses
# $C10000 so every symbol in it carries the 24-bit address code actually
# executes at. The eight areas sum to exactly $80000; the build fails on any
# other total.

MEMORY {
    FILLLOW:   start = $000000, size = $00C000, type = ro, file = %O, fill = yes, fillval = $FF;
    JUMPTAB:   start = $00C000, size = $000080, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM0:      start = $00C080, size = $003F64, type = ro, file = %O, fill = yes, fillval = $FF;
    NATIVEVEC: start = $00FFE4, size = $00000C, type = ro, file = %O, fill = yes, fillval = $FF;
    RESERVED:  start = $00FFF0, size = $000004, type = ro, file = %O, fill = yes, fillval = $FF;
    VECTORS:   start = $00FFF4, size = $00000C, type = ro, file = %O, fill = yes, fillval = $FF;
    ROMBANK1:  start = $C10000, size = $010000, type = ro, file = %O, fill = yes, fillval = $FF;
    FILLHIGH:  start = $C20000, size = $060000, type = ro, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    JUMPTABLE:     load = JUMPTAB,   type = ro;
    LOWCODE:       load = ROM0,      type = ro;
    LOWRODATA:     load = ROM0,      type = ro;
    NATIVEVECTORS: load = NATIVEVEC, type = ro;
    VECTORS:       load = VECTORS,   type = ro;
    FARCODE:       load = ROMBANK1,  type = ro;
    FARDATA:       load = ROMBANK1,  type = ro;
    FONTDATA:      load = ROMBANK1,  type = ro;
}
